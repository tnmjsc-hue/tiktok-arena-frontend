<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sàn Đấu Võ 2D TikTok Live</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #08080c; color: #fff; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; padding: 12px; overflow: auto; }
        #stage-shell { position: relative; width: min(calc((100svh - 24px) * 9 / 16), calc(100vw - 356px)); aspect-ratio: 9 / 16; justify-self: center; align-self: center; overflow: hidden; border: 2px solid #00ff88; border-radius: 14px; background: #11131d; box-shadow: 0 0 35px #00ff8833; }
        #game-container { position: absolute; inset: 0; }
        #game-container canvas { width: 100% !important; height: 100% !important; display: block; }
        #gift-announcement { position: absolute; z-index: 20; top: 4%; left: 50%; width: 88%; padding: 12px 14px; border: 2px solid #ffd447; border-radius: 12px; background: linear-gradient(135deg, #2d1300ee, #7a3300ee); color: #fff4a3; box-shadow: 0 0 24px #ffd447aa; font-size: clamp(14px, 2.2vw, 24px); font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transform: translate(-50%, -12px) scale(.82); transition: opacity .25s ease, transform .25s cubic-bezier(.2, 1.4, .4, 1); }
        #gift-announcement.gift-visible { opacity: 1; transform: translate(-50%, 0) scale(1); }
        #gift-announcement.gift-fading { opacity: 0; transform: translate(-50%, -18px) scale(1.03); transition-duration: .7s; }
        #ui-panel { width: 320px; max-height: calc(100svh - 24px); background: #1e1e24; padding: 20px; border: 1px solid #333; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
        h2 { color: #00ff88; font-size: 16px; text-transform: uppercase; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: #aaa; }
        input, button { padding: 10px; border-radius: 6px; border: none; font-size: 13px; }
        input { background: #2a2a35; color: #fff; border: 1px solid #444; }
        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc6a; }
        .btn-test { background: #3a3a4a; color: #fff; }
        .btn-test:hover { background: #5a5a6a; }
        .btn-test:disabled { opacity: 0.45; cursor: not-allowed; }
        #status-box { padding: 8px; background: #2a2a35; border-radius: 6px; font-size: 12px; border-left: 4px solid #ff4444; }
        .status-online { border-left-color: #00ff88 !important; }
        #log-box { flex: 1; background: #0d0d11; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; overflow-y: auto; color: #00ff88; }
        @media (max-width: 850px) {
            body { display: flex; flex-direction: column; align-items: center; padding: 8px; gap: 10px; }
            #stage-shell { width: min(100%, calc((100svh - 16px) * 9 / 16)); flex: 0 0 auto; }
            #ui-panel { width: min(100%, 540px); max-height: none; overflow: visible; }
            #log-box { min-height: 180px; }
        }
    </style>
</head>
<body>

    <div id="stage-shell">
        <div id="game-container"></div>
        <div id="gift-announcement" role="status" aria-live="polite"></div>
    </div>

    <div id="ui-panel">
        <h2>TikTok Arena 2D</h2>
        
        <div class="form-group">
            <label>Kết nối TikTok Live:</label>
            <input type="text" id="tiktok-username" placeholder="Nhập @username hoặc link vt.tiktok.com/...">
            <button onclick="connectTikTok()">Kết Nối Live</button>
        </div>

        <div id="status-box">Trạng thái: Chưa kết nối</div>

        <hr style="border-color: #333;">

        <h2>Test Lệnh Tương Tác</h2>
        <button class="btn-test" onclick="sendTest('SPAWN_AUDIENCE', 'join')">+1 Khán giả mới vào phòng</button>
        <button class="btn-test" onclick="sendTest('ATTACK', 'punch')">Võ sĩ 1 Đấm (!dam)</button>
        <button class="btn-test" onclick="sendTest('ATTACK', 'kick')">Võ sĩ 1 Đá (!da)</button>
        <button class="btn-test" onclick="sendTest('ATTACK', 'energy')">Võ sĩ 1 Chưởng (!chuong)</button>
        <button class="btn-test" onclick="sendTest('DEFENSE', 'block')">Võ sĩ 2 Đỡ (!do)</button>
        <button class="btn-test" onclick="sendTest('DEFENSE', 'dodge')">Võ sĩ 2 Né (!ne)</button>
        <button class="btn-test" onclick="sendTest('REACTION', 'hit')">Võ sĩ 2 Trúng đòn (!trung)</button>
        <button class="btn-test" onclick="sendTest('REACTION', 'knockdown')">Võ sĩ 2 Gục ngã (!nga)</button>
        <button class="btn-test" onclick="sendTest('CAMERA', 'zoom_in')">Zoom Camera (!zoom)</button>
        <button class="btn-test" onclick="sendTest('GIFT_RECEIVED', 'gift', { giftName: 'Rose', count: 1, diamondCount: 1 })">Test tặng Hoa Hồng</button>
        <button class="btn-test" onclick="sendTest('ULTIMATE', 'strike')">Quà Khủng (Kỹ năng tối thượng)</button>

        <label>Nhật ký sự kiện:</label>
        <div id="log-box"></div>
    </div>

    <script>
        // THAY BẰNG LINK RENDER CỦA BẠN VÀO DÒNG DƯỚI DÂY:
        const BACKEND_URL = 'https://tiktok-arena-backend.onrender.com';

        const socket = io(BACKEND_URL, {
            transports: ['polling', 'websocket']
        });
        const LIVE_INPUT_KEY = 'tiktok-arena-live-input';
        let connectRequestInFlight = false;

        function setTestButtonsEnabled(enabled) {
            document.querySelectorAll('.btn-test').forEach(button => {
                button.disabled = !enabled;
            });
        }

        setTestButtonsEnabled(false);

        function log(msg) {
            const box = document.getElementById('log-box');
            box.innerHTML += `<div>> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        socket.on('connect', () => {
            log("Đã kết nối thành công tới Server Render!");
            setTestButtonsEnabled(true);
            socket.timeout(5000).emit('GET_TIKTOK_STATUS', (err, status) => {
                if (err || !status) return;

                if (status.connected) {
                    const statusBox = document.getElementById('status-box');
                    statusBox.innerHTML = `Đã kết nối Live: @${status.username}`;
                    statusBox.classList.add('status-online');
                    return;
                }

                if (!status.connecting) {
                    const savedInput = localStorage.getItem(LIVE_INPUT_KEY);
                    if (savedInput) {
                        log('Backend vừa kết nối lại, đang tự khôi phục TikTok Live...');
                        connectTikTok(savedInput, true);
                    }
                }
            });
        });

        socket.on('disconnect', () => {
            setTestButtonsEnabled(false);
            log('Mất kết nối Server Render, đang chờ kết nối lại...');
        });

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            backgroundColor: '#1a1a24',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 540,
                height: 960
            },
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);

        const giftAnnouncement = document.getElementById('gift-announcement');
        let fighter1, fighter2, actionText;
        let audiences = [];
        let sceneRef;
        let giftEffectTimer = null;
        let giftCleanupTimer = null;
        let focusedGiftAudience = null;

        const FIGHTER_FRAME = Object.freeze({
            idle: 0,
            punch: 1,
            kick: 2,
            energy: 3,
            block: 4,
            hit: 5,
            dodge: 6,
            knockdown: 7
        });
        const fighterPoseTimers = new Map();

        function preload() {
            this.load.spritesheet('fighter_blue', 'assets/fighter-blue.png', {
                frameWidth: 384,
                frameHeight: 512
            });
            this.load.spritesheet('fighter_red', 'assets/fighter-red.png', {
                frameWidth: 384,
                frameHeight: 512
            });

            let g = this.add.graphics();

            // Vẽ Khán giả (Trắng hạt tròn)
            g.fillStyle(0xffffff, 1);
            g.fillCircle(8, 8, 8);
            g.generateTexture('audience_tex', 16, 16);
            g.destroy();
        }

        function create() {
            sceneRef = this;

            // Toàn bộ sân khấu nằm trong một khung dọc 9:16.
            const stage = this.add.rectangle(270, 480, 516, 924, 0x11131d);
            stage.setStrokeStyle(3, 0x334155);

            // Khán đài nhiều tầng phía sau.
            this.add.rectangle(270, 278, 480, 350, 0x151827);
            this.add.rectangle(270, 205, 464, 78, 0x202538);
            this.add.rectangle(270, 295, 464, 78, 0x1c2132);
            this.add.rectangle(270, 385, 464, 78, 0x181d2c);
            this.add.text(270, 82, 'KHÁN ĐÀI LIVE', {
                fill: '#5ee7a8',
                fontSize: '25px',
                fontWeight: 'bold',
                letterSpacing: 2
            }).setOrigin(0.5);

            // Sàn đấu võ.
            const ring = this.add.rectangle(270, 675, 460, 270, 0x2a2a38);
            ring.setStrokeStyle(4, 0x00ff88);
            this.add.rectangle(270, 805, 480, 18, 0x00aa66);

            // Hai Võ sĩ
            fighter1 = this.add.sprite(155, 805, 'fighter_blue', FIGHTER_FRAME.idle)
                .setOrigin(0.5, 0.88)
                .setScale(0.58);
            fighter2 = this.add.sprite(385, 805, 'fighter_red', FIGHTER_FRAME.idle)
                .setOrigin(0.5, 0.88)
                .setScale(0.58);

            // Text hiển thị hành động
            actionText = this.add.text(270, 505, 'SẴN SÀNG ĐẤU!', {
                fontSize: '18px',
                fill: '#00ff88',
                fontWeight: 'bold',
                backgroundColor: '#000000aa',
                padding: { x: 10, y: 5 }
            }).setOrigin(0.5);

            log("Game đã sẵn sàng!");
        }

        function update() {}

        function playPose(fighter, pose, duration = 650) {
            const oldTimer = fighterPoseTimers.get(fighter);
            if (oldTimer) oldTimer.remove(false);

            fighter.setFrame(FIGHTER_FRAME[pose] ?? FIGHTER_FRAME.idle);
            const timer = sceneRef.time.delayedCall(duration, () => {
                if (fighter.active) {
                    fighter.setFrame(FIGHTER_FRAME.idle);
                    fighter.clearTint();
                }
                fighterPoseTimers.delete(fighter);
            });
            fighterPoseTimers.set(fighter, timer);
        }

        function playHitReaction(knockdown = false) {
            playPose(fighter2, knockdown ? 'knockdown' : 'hit', knockdown ? 2200 : 700);
            fighter2.setTint(0xffb0b0);
            sceneRef.cameras.main.shake(knockdown ? 220 : 110, knockdown ? 0.018 : 0.009);
        }

        function launchEnergyProjectile() {
            const orb = sceneRef.add.circle(fighter1.x + 68, fighter1.y - 118, 17, 0x4fdcff, 0.95)
                .setStrokeStyle(5, 0xe8ffff, 1);
            orb.setBlendMode(Phaser.BlendModes.ADD);
            sceneRef.tweens.add({
                targets: orb,
                x: fighter2.x - 30,
                scaleX: 1.7,
                scaleY: 1.7,
                duration: 430,
                ease: 'Sine.easeIn',
                onComplete: () => {
                    orb.destroy();
                    playHitReaction(false);
                    sceneRef.cameras.main.flash(120, 80, 210, 255);
                }
            });
        }

        function addAudience(user) {
            if (audiences.length >= 50) {
                const oldAudience = audiences.shift();
                oldAudience.sprite.destroy();
                oldAudience.text.destroy();
            }

            const x = Phaser.Math.Between(65, 475);
            const audienceRow = Phaser.Math.Between(0, 2);
            const y = 205 + (audienceRow * 90) + Phaser.Math.Between(-22, 22);
            const sprite = sceneRef.add.sprite(x, y, 'audience_tex');
            const baseTint = Phaser.Display.Color.RandomRGB().color;
            sprite.setTint(baseTint);

            const nameTag = sceneRef.add.text(x, y - 12, user, {
                fontSize: '9px',
                fill: '#00ff88',
                backgroundColor: '#00000088'
            }).setOrigin(0.5);

            const audience = { user, sprite, text: nameTag, baseTint };
            audiences.push(audience);

            sprite.setScale(0);
            sceneRef.tweens.add({ targets: sprite, scaleX: 1, scaleY: 1, duration: 200 });
            sceneRef.tweens.add({
                targets: [sprite, nameTag],
                y: '-=5',
                duration: Phaser.Math.Between(300, 500),
                yoyo: true,
                repeat: -1,
                delay: Phaser.Math.Between(0, 400)
            });

            return audience;
        }

        function findAudience(user) {
            const normalizedUser = String(user || '').trim().toLowerCase();
            return [...audiences].reverse().find(audience =>
                String(audience.user || '').trim().toLowerCase() === normalizedUser
            );
        }

        function showGiftEffect(data) {
            let audience = findAudience(data.user);
            if (!audience) audience = addAudience(data.user || 'Khán giả');

            const camera = sceneRef.cameras.main;
            const count = Math.max(1, Number(data.count) || 1);
            const giftName = data.giftName || 'Món quà';

            if (giftEffectTimer) giftEffectTimer.remove(false);
            if (giftCleanupTimer) giftCleanupTimer.remove(false);
            if (focusedGiftAudience) {
                if (focusedGiftAudience.sprite.active) {
                    focusedGiftAudience.sprite.setTint(focusedGiftAudience.baseTint);
                }
                if (focusedGiftAudience.text.active) focusedGiftAudience.text.setColor('#00ff88');
            }
            focusedGiftAudience = audience;
            camera.panEffect.reset();
            camera.zoomEffect.reset();

            giftAnnouncement.classList.remove('gift-visible', 'gift-fading');
            giftAnnouncement.textContent = `🎁 ${data.user} tặng ${count}x ${giftName}! 🎁`;
            void giftAnnouncement.offsetWidth;
            giftAnnouncement.classList.add('gift-visible');

            audience.sprite.setTint(0xffd447);
            audience.text.setColor('#fff4a3');

            camera.flash(250, 255, 220, 80);
            camera.pan(audience.sprite.x, audience.sprite.y, 450, 'Sine.easeInOut');
            camera.zoomTo(2.2, 450, 'Sine.easeInOut');

            giftEffectTimer = sceneRef.time.delayedCall(2300, () => {
                giftAnnouncement.classList.add('gift-fading');
                camera.pan(270, 480, 700, 'Sine.easeInOut');
                camera.zoomTo(1, 700, 'Sine.easeInOut');
                if (audience.sprite.active) audience.sprite.setTint(audience.baseTint);
                if (audience.text.active) audience.text.setColor('#00ff88');
                focusedGiftAudience = null;
                giftEffectTimer = null;
            });

            giftCleanupTimer = sceneRef.time.delayedCall(3000, () => {
                giftAnnouncement.classList.remove('gift-visible', 'gift-fading');
                giftCleanupTimer = null;
            });
        }

        // Xử lý Lệnh từ Server gửi xuống
        socket.on('GAME_COMMAND', (data) => {
            log(`${data.type} - ${data.action || ''} (${data.user || ''})`);

            // 1. TẠO KHÁN GIẢ MỚI
            if (data.type === 'SPAWN_AUDIENCE') {
                actionText.setText(`${data.user} VỪA VÀO PHÒNG!`);
                addAudience(data.user);
            }
            // 2. TẤN CÔNG
            else if (data.type === 'ATTACK') {
                if (data.action === 'punch') {
                    actionText.setText(`${data.user}: TUNG CÚ ĐẤM!`);
                    playPose(fighter1, 'punch', 520);
                    sceneRef.tweens.add({
                        targets: fighter1,
                        x: 220,
                        duration: 150,
                        yoyo: true,
                        onYoyo: () => playHitReaction(false)
                    });
                } else if (data.action === 'kick') {
                    actionText.setText(`${data.user}: TUNG CÚ ĐÁ!`);
                    playPose(fighter1, 'kick', 650);
                    sceneRef.tweens.add({
                        targets: fighter1,
                        x: 225,
                        duration: 200,
                        yoyo: true,
                        onYoyo: () => playHitReaction(false)
                    });
                } else if (data.action === 'energy') {
                    actionText.setText(`${data.user}: TUNG CHƯỞNG!`);
                    playPose(fighter1, 'energy', 900);
                    sceneRef.time.delayedCall(180, launchEnergyProjectile);
                }
            }
            // 3. PHÒNG THỦ
            else if (data.type === 'DEFENSE') {
                if (data.action === 'block') {
                    actionText.setText(`${data.user}: ĐỠ ĐÒN!`);
                    playPose(fighter2, 'block', 1000);
                } else if (data.action === 'dodge') {
                    actionText.setText(`${data.user}: NÉ ĐÒN!`);
                    playPose(fighter2, 'dodge', 850);
                    sceneRef.tweens.add({ targets: fighter2, x: 425, duration: 220, yoyo: true });
                }
            }
            // 4. PHẢN ỨNG TRÚNG ĐÒN
            else if (data.type === 'REACTION') {
                const knockedDown = data.action === 'knockdown';
                actionText.setText(`${data.user}: ${knockedDown ? 'GỤC NGÃ!' : 'TRÚNG ĐÒN!'}`);
                playHitReaction(knockedDown);
            }
            // 3. CAMERA
            else if (data.type === 'CAMERA') {
                if (data.action === 'zoom_in') {
                    actionText.setText(`CAMERA: CẬN CẢNH!`);
                    sceneRef.cameras.main.zoomTo(1.4, 400);
                    setTimeout(() => sceneRef.cameras.main.zoomTo(1.0, 400), 1800);
                }
            }
            // 4. QUÀ LỚN
            else if (data.type === 'ULTIMATE') {
                actionText.setText(`🔥 ${data.user} TẶNG QUÀ LỚN! 🔥`);
                sceneRef.cameras.main.flash(400, 255, 255, 255);
                sceneRef.cameras.main.shake(400, 0.03);
            }
            // 5. NGƯỜI XEM TẶNG QUÀ
            else if (data.type === 'GIFT_RECEIVED') {
                showGiftEffect(data);
            }
            // 6. THẢ TIM
            else if (data.type === 'ENVIRONMENT') {
                sceneRef.cameras.main.setBackgroundColor('#2a1a34');
                setTimeout(() => sceneRef.cameras.main.setBackgroundColor('#1a1a24'), 150);
            }
        });

        socket.on('TIKTOK_STATUS', (data) => {
            const statusBox = document.getElementById('status-box');
            if (data.connected) {
                statusBox.innerHTML = `Đã kết nối Live: @${data.username}`;
                statusBox.classList.add('status-online');
                log(`Đã kết nối thành công TikTok Live của: @${data.username}`);
            } else {
                statusBox.innerHTML = `Lỗi kết nối TikTok!`;
                statusBox.classList.remove('status-online');
                log(`Lỗi kết nối TikTok Live.`);
            }
        });

        function connectTikTok(savedInput = null, automatic = false) {
            if (connectRequestInFlight) return;

            const input = document.getElementById('tiktok-username');
            const username = (savedInput || input.value).trim();
            if (!username) return alert("Vui lòng nhập Username hoặc link TikTok Live!");
            if (automatic) input.value = username;

            log(`Đang gửi yêu cầu kết nối TikTok: ${username}...`);
            connectRequestInFlight = true;
            fetch(`${BACKEND_URL}/api/connect-tiktok`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            }).then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    const message = data.error || 'Không thể kết nối TikTok Live';
                    log(`Lỗi: ${message}`);
                    if (!automatic) alert(message);
                } else {
                    localStorage.setItem(LIVE_INPUT_KEY, username);
                }
            }).catch(err => {
                log(`Lỗi gọi Backend: ${err.message}`);
            }).finally(() => {
                connectRequestInFlight = false;
            });
        }

        function sendTest(type, action, extra = {}) {
            if (!socket.connected) {
                log('Chưa kết nối Server Render nên chưa thể gửi lệnh test.');
                return;
            }

            fetch(`${BACKEND_URL}/api/test-command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type,
                    action,
                    user: 'User_' + Math.floor(Math.random()*100),
                    ...extra
                })
            }).then(async response => {
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || `Backend trả lỗi ${response.status}`);
                }
            }).catch(err => {
                log(`Không gửi được lệnh test: ${err.message}`);
            });
        }
    </script>
</body>
</html>

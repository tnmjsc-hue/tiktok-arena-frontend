<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sàn Đấu Võ 2D TikTok Live</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; overflow: hidden; display: flex; height: 100vh; }
        #game-container { flex: 1; height: 100%; position: relative; }
        #ui-panel { width: 320px; background: #1e1e24; padding: 20px; border-left: 2px solid #333; display: flex; flex-direction: column; gap: 12px; }
        h2 { color: #00ff88; font-size: 16px; text-transform: uppercase; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: #aaa; }
        input, button { padding: 10px; border-radius: 6px; border: none; font-size: 13px; }
        input { background: #2a2a35; color: #fff; border: 1px solid #444; }
        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc6a; }
        .btn-test { background: #3a3a4a; color: #fff; }
        .btn-test:hover { background: #5a5a6a; }
        .btn-test:disabled { opacity: 0.45; cursor: not-allowed; }
        #status-box { padding: 8px; background: #2a2a35; border-radius: 6px; font-size: 12px; border-left: 4px solid #ff4444; }
        .status-online { border-left-color: #00ff88 !important; }
        #log-box { flex: 1; background: #0d0d11; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; overflow-y: auto; color: #00ff88; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-panel">
        <h2>TikTok Arena 2D</h2>
        
        <div class="form-group">
            <label>Kết nối TikTok Live:</label>
            <input type="text" id="tiktok-username" placeholder="Nhập @username hoặc link vt.tiktok.com/...">
            <button onclick="connectTikTok()">Kết Nối Live</button>
        </div>

        <div id="status-box">Trạng thái: Chưa kết nối</div>

        <hr style="border-color: #333;">

        <h2>Test Lệnh Tương Tác</h2>
        <button class="btn-test" onclick="sendTest('SPAWN_AUDIENCE', 'join')">+1 Khán giả mới vào phòng</button>
        <button class="btn-test" onclick="sendTest('ATTACK', 'punch')">Võ sĩ 1 Đấm (!dam)</button>
        <button class="btn-test" onclick="sendTest('ATTACK', 'kick')">Võ sĩ 1 Đá (!da)</button>
        <button class="btn-test" onclick="sendTest('CAMERA', 'zoom_in')">Zoom Camera (!zoom)</button>
        <button class="btn-test" onclick="sendTest('ULTIMATE', 'strike')">Quà Khủng (Kỹ năng tối thượng)</button>

        <label>Nhật ký sự kiện:</label>
        <div id="log-box"></div>
    </div>

    <script>
        // THAY BẰNG LINK RENDER CỦA BẠN VÀO DÒNG DƯỚI DÂY:
        const BACKEND_URL = 'https://tiktok-arena-backend.onrender.com';

        const socket = io(BACKEND_URL, {
            transports: ['polling', 'websocket']
        });
        const LIVE_INPUT_KEY = 'tiktok-arena-live-input';
        let connectRequestInFlight = false;

        function setTestButtonsEnabled(enabled) {
            document.querySelectorAll('.btn-test').forEach(button => {
                button.disabled = !enabled;
            });
        }

        setTestButtonsEnabled(false);

        function log(msg) {
            const box = document.getElementById('log-box');
            box.innerHTML += `<div>> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        socket.on('connect', () => {
            log("Đã kết nối thành công tới Server Render!");
            setTestButtonsEnabled(true);
            socket.timeout(5000).emit('GET_TIKTOK_STATUS', (err, status) => {
                if (err || !status) return;

                if (status.connected) {
                    const statusBox = document.getElementById('status-box');
                    statusBox.innerHTML = `Đã kết nối Live: @${status.username}`;
                    statusBox.classList.add('status-online');
                    return;
                }

                if (!status.connecting) {
                    const savedInput = localStorage.getItem(LIVE_INPUT_KEY);
                    if (savedInput) {
                        log('Backend vừa kết nối lại, đang tự khôi phục TikTok Live...');
                        connectTikTok(savedInput, true);
                    }
                }
            });
        });

        socket.on('disconnect', () => {
            setTestButtonsEnabled(false);
            log('Mất kết nối Server Render, đang chờ kết nối lại...');
        });

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: 1000,
            height: 700,
            backgroundColor: '#1a1a24',
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);

        let fighter1, fighter2, actionText;
        let audiences = [];
        let sceneRef;

        function preload() {
            let g = this.add.graphics();
            
            // Vẽ Võ sĩ 1 (Xanh)
            g.fillStyle(0x00aaff, 1);
            g.fillRect(0, 0, 40, 80);
            g.generateTexture('fighter1_tex', 40, 80);
            g.clear();

            // Vẽ Võ sĩ 2 (Đỏ)
            g.fillStyle(0xff4444, 1);
            g.fillRect(0, 0, 40, 80);
            g.generateTexture('fighter2_tex', 40, 80);
            g.clear();

            // Vẽ Khán giả (Trắng hạt tròn)
            g.fillStyle(0xffffff, 1);
            g.fillCircle(8, 8, 8);
            g.generateTexture('audience_tex', 16, 16);
            g.destroy();
        }

        function create() {
            sceneRef = this;

            // Sàn đấu Võ
            let ring = this.add.rectangle(500, 480, 700, 220, 0x2a2a38);
            ring.setStrokeStyle(4, 0x00ff88);

            // Khán đài phía sau
            this.add.rectangle(500, 200, 800, 160, 0x15151e);
            this.add.text(420, 130, 'KHÁN ĐÀI', { fill: '#333', fontSize: '28px', fontWeight: 'bold' });

            // Hai Võ sĩ
            fighter1 = this.add.sprite(350, 440, 'fighter1_tex');
            fighter2 = this.add.sprite(650, 440, 'fighter2_tex');

            // Text hiển thị hành động
            actionText = this.add.text(500, 320, 'SẴN SÀNG ĐẤU!', { 
                fontSize: '18px', 
                fill: '#00ff88', 
                fontWeight: 'bold',
                backgroundColor: '#000000aa',
                padding: { x: 10, y: 5 }
            }).setOrigin(0.5);

            log("Game đã sẵn sàng!");
        }

        function update() {}

        // Xử lý Lệnh từ Server gửi xuống
        socket.on('GAME_COMMAND', (data) => {
            log(`${data.type} - ${data.action || ''} (${data.user || ''})`);

            // 1. TẠO KHÁN GIẢ MỚI
            if (data.type === 'SPAWN_AUDIENCE') {
                actionText.setText(`${data.user} VỪA VÀO PHÒNG!`);
                
                // Giới hạn tối đa 50 khán giả để không bị giật lag
                if (audiences.length >= 50) {
                    let oldAud = audiences.shift();
                    oldAud.sprite.destroy();
                    oldAud.text.destroy();
                }

                let rx = Phaser.Math.Between(150, 850);
                let ry = Phaser.Math.Between(160, 240);
                
                let audSprite = sceneRef.add.sprite(rx, ry, 'audience_tex');
                audSprite.setTint(Phaser.Display.Color.RandomRGB().color);

                let nameTag = sceneRef.add.text(rx, ry - 12, data.user, { 
                    fontSize: '9px', 
                    fill: '#00ff88',
                    backgroundColor: '#00000088'
                }).setOrigin(0.5);

                audiences.push({ sprite: audSprite, text: nameTag });

                audSprite.setScale(0);
                sceneRef.tweens.add({ targets: audSprite, scaleX: 1, scaleY: 1, duration: 200 });
                sceneRef.tweens.add({
                    targets: [audSprite, nameTag],
                    y: '-=5',
                    duration: Phaser.Math.Between(300, 500),
                    yoyo: true,
                    repeat: -1,
                    delay: Phaser.Math.Between(0, 400)
                });
            }
            // 2. TẤN CÔNG
            else if (data.type === 'ATTACK') {
                if (data.action === 'punch') {
                    actionText.setText(`${data.user}: TUNG CÚ ĐẤM!`);
                    sceneRef.tweens.add({
                        targets: fighter1,
                        x: 600,
                        duration: 150,
                        yoyo: true,
                        onYoyo: () => sceneRef.cameras.main.shake(100, 0.01)
                    });
                } else if (data.action === 'kick') {
                    actionText.setText(`${data.user}: TUNG CÚ ĐÁ!`);
                    sceneRef.tweens.add({
                        targets: fighter1,
                        x: 620,
                        angle: -20,
                        duration: 200,
                        yoyo: true,
                        onComplete: () => fighter1.setAngle(0)
                    });
                }
            } 
            // 3. CAMERA
            else if (data.type === 'CAMERA') {
                if (data.action === 'zoom_in') {
                    actionText.setText(`CAMERA: CẬN CẢNH!`);
                    sceneRef.cameras.main.zoomTo(1.4, 400);
                    setTimeout(() => sceneRef.cameras.main.zoomTo(1.0, 400), 1800);
                }
            }
            // 4. QUÀ LỚN
            else if (data.type === 'ULTIMATE') {
                actionText.setText(`🔥 ${data.user} TẶNG QUÀ LỚN! 🔥`);
                sceneRef.cameras.main.flash(400, 255, 255, 255);
                sceneRef.cameras.main.shake(400, 0.03);
            }
            // 5. THẢ TIM
            else if (data.type === 'ENVIRONMENT') {
                sceneRef.cameras.main.setBackgroundColor('#2a1a34');
                setTimeout(() => sceneRef.cameras.main.setBackgroundColor('#1a1a24'), 150);
            }
        });

        socket.on('TIKTOK_STATUS', (data) => {
            const statusBox = document.getElementById('status-box');
            if (data.connected) {
                statusBox.innerHTML = `Đã kết nối Live: @${data.username}`;
                statusBox.classList.add('status-online');
                log(`Đã kết nối thành công TikTok Live của: @${data.username}`);
            } else {
                statusBox.innerHTML = `Lỗi kết nối TikTok!`;
                statusBox.classList.remove('status-online');
                log(`Lỗi kết nối TikTok Live.`);
            }
        });

        function connectTikTok(savedInput = null, automatic = false) {
            if (connectRequestInFlight) return;

            const input = document.getElementById('tiktok-username');
            const username = (savedInput || input.value).trim();
            if (!username) return alert("Vui lòng nhập Username hoặc link TikTok Live!");
            if (automatic) input.value = username;

            log(`Đang gửi yêu cầu kết nối TikTok: ${username}...`);
            connectRequestInFlight = true;
            fetch(`${BACKEND_URL}/api/connect-tiktok`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            }).then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    const message = data.error || 'Không thể kết nối TikTok Live';
                    log(`Lỗi: ${message}`);
                    if (!automatic) alert(message);
                } else {
                    localStorage.setItem(LIVE_INPUT_KEY, username);
                }
            }).catch(err => {
                log(`Lỗi gọi Backend: ${err.message}`);
            }).finally(() => {
                connectRequestInFlight = false;
            });
        }

        function sendTest(type, action) {
            if (!socket.connected) {
                log('Chưa kết nối Server Render nên chưa thể gửi lệnh test.');
                return;
            }

            fetch(`${BACKEND_URL}/api/test-command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, action, user: 'User_' + Math.floor(Math.random()*100) })
            }).then(async response => {
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || `Backend trả lỗi ${response.status}`);
                }
            }).catch(err => {
                log(`Không gửi được lệnh test: ${err.message}`);
            });
        }
    </script>
</body>
</html>

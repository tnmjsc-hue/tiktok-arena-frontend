<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sàn Đấu Võ 2D TikTok Live</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #08080c; color: #fff; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; padding: 12px; overflow: auto; }
        #stage-shell { position: relative; width: min(calc((100svh - 24px) * 9 / 16), calc(100vw - 356px)); aspect-ratio: 9 / 16; justify-self: center; align-self: center; overflow: hidden; border: 2px solid #00ff88; border-radius: 14px; background: #11131d; box-shadow: 0 0 35px #00ff8833; }
        #game-container { position: absolute; inset: 0; }
        #game-container canvas { width: 100% !important; height: 100% !important; display: block; }
        #gift-announcement { position: absolute; z-index: 20; top: 4%; left: 50%; width: 88%; padding: 12px 14px; border: 2px solid #ffd447; border-radius: 12px; background: linear-gradient(135deg, #2d1300ee, #7a3300ee); color: #fff4a3; box-shadow: 0 0 24px #ffd447aa; font-size: clamp(14px, 2.2vw, 24px); font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transform: translate(-50%, -12px) scale(.82); transition: opacity .25s ease, transform .25s cubic-bezier(.2, 1.4, .4, 1); }
        #gift-announcement.gift-visible { opacity: 1; transform: translate(-50%, 0) scale(1); }
        #gift-announcement.gift-fading { opacity: 0; transform: translate(-50%, -18px) scale(1.03); transition-duration: .7s; }
        #ui-panel { width: 320px; max-height: calc(100svh - 24px); background: #1e1e24; padding: 20px; border: 1px solid #333; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        h2 { color: #00ff88; font-size: 16px; text-transform: uppercase; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: #aaa; }
        input, button { padding: 10px; border-radius: 6px; border: none; font-size: 13px; }
        input { background: #2a2a35; color: #fff; border: 1px solid #444; }
        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc6a; }
        .btn-test { background: #3a3a4a; color: #fff; }
        .btn-test:hover { background: #5a5a6a; }
        .btn-test:disabled { opacity: 0.45; cursor: not-allowed; }
        #status-box { padding: 8px; background: #2a2a35; border-radius: 6px; font-size: 12px; border-left: 4px solid #ff4444; }
        .status-online { border-left-color: #00ff88 !important; }
        #log-box { flex: 1 0 150px; min-height: 150px; background: #0d0d11; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; overflow-y: auto; color: #00ff88; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .upload-control { display: flex; flex-direction: column; gap: 5px; padding: 8px; border: 1px solid #3b4252; border-radius: 8px; background: #171820; }
        .upload-control strong { font-size: 12px; color: #fff; }
        .upload-control input { width: 100%; padding: 6px; font-size: 10px; }
        .upload-hint { color: #8f9bad; font-size: 10px; line-height: 1.4; }
        @media (max-width: 850px) {
            body { display: flex; flex-direction: column; align-items: center; padding: 8px; gap: 10px; }
            #stage-shell { width: min(100%, calc((100svh - 16px) * 9 / 16)); flex: 0 0 auto; }
            #ui-panel { width: min(100%, 540px); max-height: none; overflow: visible; }
            #log-box { min-height: 180px; }
        }
    </style>
</head>
<body>

    <div id="stage-shell">
        <div id="game-container"></div>
        <div id="gift-announcement" role="status" aria-live="polite"></div>
    </div>

    <div id="ui-panel">
        <h2>TikTok Arena 2D</h2>
        
        <div class="form-group">
            <label>Kết nối TikTok Live:</label>
            <input type="text" id="tiktok-username" placeholder="Nhập @username hoặc link vt.tiktok.com/...">
            <button onclick="connectTikTok()">Kết Nối Live</button>
        </div>

        <div id="status-box">Trạng thái: Chưa kết nối</div>

        <hr style="border-color: #333;">

        <h2>Test Lệnh Tương Tác</h2>
        <button class="btn-test" onclick="sendTest('SPAWN_AUDIENCE', 'join')">+1 Khán giả mới vào phòng</button>
        <button class="btn-test" onclick="sendTest('FINISHER', 'punch', { side: 'blue' })">Xanh hạ Đỏ bằng Đấm (!dam)</button>
        <button class="btn-test" onclick="sendTest('FINISHER', 'kick', { side: 'blue' })">Xanh hạ Đỏ bằng Đá (!da)</button>
        <button class="btn-test" onclick="sendTest('FINISHER', 'energy', { side: 'blue' })">Xanh hạ Đỏ bằng Chưởng (!chuong)</button>
        <button class="btn-test" onclick="sendTest('FINISHER', 'punch', { side: 'red' })">Đỏ hạ Xanh bằng Đấm (!damdo)</button>
        <button class="btn-test" onclick="sendTest('FINISHER', 'kick', { side: 'red' })">Đỏ hạ Xanh bằng Đá (!dado)</button>
        <button class="btn-test" onclick="sendTest('FINISHER', 'energy', { side: 'red' })">Đỏ hạ Xanh bằng Chưởng (!chuongdo)</button>
        <button class="btn-test" onclick="sendTest('CAMERA', 'zoom_in')">Zoom Camera (!zoom)</button>
        <button class="btn-test" onclick="sendTest('GIFT_RECEIVED', 'gift', { giftName: 'Rose', count: 1, diamondCount: 1 })">Test quà nhỏ</button>
        <button class="btn-test" onclick="sendTest('GIFT_RECEIVED', 'gift', { giftName: 'TikTok Universe', count: 1, diamondCount: 34999, isLargeGift: true })">Test quà lớn → Đỏ tung chưởng</button>

        <hr style="border-color: #333;">
        <h2>Thay Thiết Kế Võ Sĩ</h2>
        <div class="upload-grid">
            <label class="upload-control">
                <strong>Võ sĩ Xanh</strong>
                <input type="file" accept="image/png,image/webp" onchange="replaceFighterAtlas('blue', this.files[0])">
            </label>
            <label class="upload-control">
                <strong>Võ sĩ Đỏ</strong>
                <input type="file" accept="image/png,image/webp" onchange="replaceFighterAtlas('red', this.files[0])">
            </label>
        </div>
        <div class="upload-hint">Atlas phải có 4 cột × 2 hàng theo thứ tự: đứng, đấm, đá, chưởng, đỡ, trúng, né, gục. Ảnh được lưu trên thiết bị này.</div>

        <label>Nhật ký sự kiện:</label>
        <div id="log-box"></div>
    </div>

    <script>
        // THAY BẰNG LINK RENDER CỦA BẠN VÀO DÒNG DƯỚI DÂY:
        const BACKEND_URL = 'https://tiktok-arena-backend.onrender.com';

        const socket = io(BACKEND_URL, {
            transports: ['polling', 'websocket']
        });
        const LIVE_INPUT_KEY = 'tiktok-arena-live-input';
        let connectRequestInFlight = false;

        function setTestButtonsEnabled(enabled) {
            document.querySelectorAll('.btn-test').forEach(button => {
                button.disabled = !enabled;
            });
        }

        setTestButtonsEnabled(false);

        function log(msg) {
            const box = document.getElementById('log-box');
            box.innerHTML += `<div>> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        socket.on('connect', () => {
            log("Đã kết nối thành công tới Server Render!");
            setTestButtonsEnabled(true);
            socket.timeout(5000).emit('GET_TIKTOK_STATUS', (err, status) => {
                if (err || !status) return;

                if (status.connected) {
                    const statusBox = document.getElementById('status-box');
                    statusBox.innerHTML = `Đã kết nối Live: @${status.username}`;
                    statusBox.classList.add('status-online');
                    return;
                }

                if (!status.connecting) {
                    const savedInput = localStorage.getItem(LIVE_INPUT_KEY);
                    if (savedInput) {
                        log('Backend vừa kết nối lại, đang tự khôi phục TikTok Live...');
                        connectTikTok(savedInput, true);
                    }
                }
            });
        });

        socket.on('disconnect', () => {
            setTestButtonsEnabled(false);
            log('Mất kết nối Server Render, đang chờ kết nối lại...');
        });

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            backgroundColor: '#1a1a24',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 540,
                height: 960
            },
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);

        const giftAnnouncement = document.getElementById('gift-announcement');
        let fighter1, fighter2, joinText;
        let audiences = [];
        let sceneRef;
        let giftEffectTimer = null;
        let giftCleanupTimer = null;
        let focusedGiftAudience = null;
        let sparringTimer = null;
        let finisherTimer = null;
        let sparringTurn = 0;
        let combatLocked = false;
        let giftPresentationActive = false;
        let pendingFinisher = null;
        let finisherSequence = 0;
        let joinMessageTimer = null;

        const FIGHTER_HOME = Object.freeze({ blue: 180, red: 360 });
        const CUSTOM_FIGHTER_DB = 'tiktok-arena-fighter-designs';

        const FIGHTER_FRAME = Object.freeze({
            idle: 0,
            punch: 1,
            kick: 2,
            energy: 3,
            block: 4,
            hit: 5,
            dodge: 6,
            knockdown: 7
        });
        const fighterPoseTimers = new Map();

        function preload() {
            this.load.spritesheet('fighter_blue', 'assets/fighter-blue.png', {
                frameWidth: 384,
                frameHeight: 512
            });
            this.load.spritesheet('fighter_red', 'assets/fighter-red.png', {
                frameWidth: 384,
                frameHeight: 512
            });

            let g = this.add.graphics();

            // Vẽ Khán giả (Trắng hạt tròn)
            g.fillStyle(0xffffff, 1);
            g.fillCircle(8, 8, 8);
            g.generateTexture('audience_tex', 16, 16);
            g.destroy();
        }

        function create() {
            sceneRef = this;

            // Toàn bộ sân khấu nằm trong một khung dọc 9:16.
            const stage = this.add.rectangle(270, 480, 516, 924, 0x11131d);
            stage.setStrokeStyle(3, 0x334155);

            // Khán đài nhiều tầng phía sau.
            this.add.rectangle(270, 278, 480, 350, 0x151827);
            this.add.rectangle(270, 205, 464, 78, 0x202538);
            this.add.rectangle(270, 295, 464, 78, 0x1c2132);
            this.add.rectangle(270, 385, 464, 78, 0x181d2c);
            this.add.text(270, 82, 'KHÁN ĐÀI LIVE', {
                fill: '#5ee7a8',
                fontSize: '25px',
                fontWeight: 'bold',
                letterSpacing: 2
            }).setOrigin(0.5);

            // Sàn đấu võ.
            const ring = this.add.rectangle(270, 675, 460, 270, 0x2a2a38);
            ring.setStrokeStyle(4, 0x00ff88);
            this.add.rectangle(270, 805, 480, 18, 0x00aa66);

            // Hai Võ sĩ
            fighter1 = this.add.sprite(FIGHTER_HOME.blue, 805, 'fighter_blue', FIGHTER_FRAME.idle)
                .setOrigin(0.5, 0.88)
                .setScale(0.58);
            fighter2 = this.add.sprite(FIGHTER_HOME.red, 805, 'fighter_red', FIGHTER_FRAME.idle)
                .setOrigin(0.5, 0.88)
                .setScale(0.58);

            joinText = this.add.text(270, 505, '', {
                fontSize: '16px',
                fill: '#00ff88',
                fontWeight: 'bold',
                backgroundColor: '#000000cc',
                padding: { x: 10, y: 5 }
            }).setOrigin(0.5).setAlpha(0).setDepth(30);

            log("Game đã sẵn sàng!");
            scheduleSparring(900);
            restoreCustomFighterAtlases();
        }

        function update() {}

        function showJoinMessage(user) {
            if (!joinText) return;
            if (joinMessageTimer) joinMessageTimer.remove(false);
            sceneRef.tweens.killTweensOf(joinText);

            joinText
                .setText(`${user || 'Khán giả'} VỪA VÀO XEM LIVE!`)
                .setY(505)
                .setAlpha(1)
                .setScale(0.88);

            sceneRef.tweens.add({
                targets: joinText,
                scaleX: 1,
                scaleY: 1,
                duration: 180,
                ease: 'Back.easeOut'
            });
            joinMessageTimer = sceneRef.time.delayedCall(1600, () => {
                sceneRef.tweens.add({
                    targets: joinText,
                    y: 493,
                    alpha: 0,
                    duration: 400,
                    ease: 'Sine.easeIn',
                    onComplete: () => joinText.setText('')
                });
                joinMessageTimer = null;
            });
        }

        function playPose(fighter, pose, duration = 650) {
            const oldTimer = fighterPoseTimers.get(fighter);
            if (oldTimer) oldTimer.remove(false);

            fighter.setFrame(FIGHTER_FRAME[pose] ?? FIGHTER_FRAME.idle);
            const timer = sceneRef.time.delayedCall(duration, () => {
                if (fighter.active) {
                    fighter.setFrame(FIGHTER_FRAME.idle);
                    fighter.clearTint();
                }
                fighterPoseTimers.delete(fighter);
            });
            fighterPoseTimers.set(fighter, timer);
        }

        function playHitReaction(fighter, knockdown = false) {
            playPose(fighter, knockdown ? 'knockdown' : 'hit', knockdown ? 2400 : 650);
            fighter.setTint(0xffb0b0);
            sceneRef.cameras.main.shake(knockdown ? 220 : 100, knockdown ? 0.018 : 0.008);
        }

        function createEnergyImpact(defender, attackerSide) {
            const direction = attackerSide === 'blue' ? 1 : -1;
            const color = attackerSide === 'blue' ? 0x4fdcff : 0xff5c73;
            const secondaryColor = attackerSide === 'blue' ? 0xc8fbff : 0xffd166;
            const impactX = defender.x - (direction * 34);
            const impactY = defender.y - 112;

            const core = sceneRef.add.circle(impactX, impactY, 24, secondaryColor, 0.95)
                .setBlendMode(Phaser.BlendModes.ADD);
            const shockwave = sceneRef.add.circle(impactX, impactY, 28, color, 0)
                .setStrokeStyle(7, secondaryColor, 1)
                .setScale(0.35)
                .setBlendMode(Phaser.BlendModes.ADD);

            sceneRef.tweens.add({
                targets: core,
                scaleX: 2.4,
                scaleY: 2.4,
                alpha: 0,
                duration: 260,
                ease: 'Quad.easeOut',
                onComplete: () => core.destroy()
            });
            sceneRef.tweens.add({
                targets: shockwave,
                scaleX: 2.8,
                scaleY: 2.8,
                alpha: 0,
                duration: 420,
                ease: 'Cubic.easeOut',
                onComplete: () => shockwave.destroy()
            });

            for (let i = 0; i < 14; i++) {
                const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
                const distance = Phaser.Math.Between(45, 105);
                const spark = sceneRef.add.circle(
                    impactX,
                    impactY,
                    Phaser.Math.Between(3, 7),
                    i % 2 === 0 ? color : secondaryColor,
                    1
                ).setBlendMode(Phaser.BlendModes.ADD);
                sceneRef.tweens.add({
                    targets: spark,
                    x: impactX + (Math.cos(angle) * distance),
                    y: impactY + (Math.sin(angle) * distance),
                    scaleX: 0.2,
                    scaleY: 0.2,
                    alpha: 0,
                    duration: Phaser.Math.Between(280, 460),
                    ease: 'Quad.easeOut',
                    onComplete: () => spark.destroy()
                });
            }

            sceneRef.tweens.add({
                targets: defender,
                x: defender.x + (direction * 28),
                duration: 150,
                ease: 'Quad.easeOut'
            });
            sceneRef.cameras.main.shake(230, 0.022);
        }

        function launchEnergyProjectile(attacker, defender, attackerSide, onImpact) {
            const direction = attackerSide === 'blue' ? 1 : -1;
            const color = attackerSide === 'blue' ? 0x4fdcff : 0xff5c73;
            const orb = sceneRef.add.circle(attacker.x + (direction * 68), attacker.y - 118, 17, color, 0.95)
                .setStrokeStyle(5, 0xffffff, 1);
            orb.setBlendMode(Phaser.BlendModes.ADD);
            sceneRef.tweens.add({
                targets: orb,
                x: defender.x - (direction * 30),
                scaleX: 1.7,
                scaleY: 1.7,
                duration: 430,
                ease: 'Sine.easeIn',
                onComplete: () => {
                    orb.destroy();
                    createEnergyImpact(defender, attackerSide);
                    onImpact();
                    sceneRef.cameras.main.flash(120, 80, 210, 255);
                }
            });
        }

        function resetFighters() {
            [fighter1, fighter2].forEach(fighter => {
                const timer = fighterPoseTimers.get(fighter);
                if (timer) timer.remove(false);
                fighterPoseTimers.delete(fighter);
                sceneRef.tweens.killTweensOf(fighter);
                fighter.setFrame(FIGHTER_FRAME.idle).clearTint().setAlpha(1).setAngle(0);
            });
            fighter1.x = FIGHTER_HOME.blue;
            fighter2.x = FIGHTER_HOME.red;
        }

        function scheduleSparring(delay = 900) {
            if (!sceneRef) return;
            if (sparringTimer) sparringTimer.remove(false);
            sparringTimer = sceneRef.time.delayedCall(delay, runSparringExchange);
        }

        function runSparringExchange() {
            sparringTimer = null;
            if (combatLocked) {
                scheduleSparring(500);
                return;
            }

            const blueAttacks = sparringTurn % 2 === 0;
            const attacker = blueAttacks ? fighter1 : fighter2;
            const defender = blueAttacks ? fighter2 : fighter1;
            const direction = blueAttacks ? 1 : -1;
            const attackPose = Phaser.Math.RND.pick(['punch', 'kick']);
            const defensePose = Phaser.Math.RND.pick(['block', 'dodge', 'hit']);
            sparringTurn += 1;

            playPose(attacker, attackPose, 620);
            playPose(defender, defensePose, 620);
            if (defensePose === 'hit') defender.setTint(0xffc2c2);

            sceneRef.tweens.add({
                targets: attacker,
                x: attacker.x + (direction * 65),
                duration: 190,
                yoyo: true,
                ease: 'Sine.easeInOut',
                onComplete: () => scheduleSparring(Phaser.Math.Between(650, 1100))
            });
            if (defensePose === 'dodge') {
                sceneRef.tweens.add({ targets: defender, x: defender.x - (direction * 30), duration: 190, yoyo: true });
            }
        }

        function runFinisher(side = 'blue', action = 'punch', user = 'Khán giả') {
            if (!sceneRef) return;
            if (giftPresentationActive) {
                pendingFinisher = { side, action, user };
                return;
            }
            combatLocked = true;
            const sequence = ++finisherSequence;
            if (sparringTimer) sparringTimer.remove(false);
            if (finisherTimer) finisherTimer.remove(false);
            resetFighters();

            const attacker = side === 'red' ? fighter2 : fighter1;
            const defender = side === 'red' ? fighter1 : fighter2;
            const direction = side === 'red' ? -1 : 1;
            playPose(attacker, action, 1050);

            const knockDown = () => playHitReaction(defender, true);
            if (action === 'energy') {
                sceneRef.time.delayedCall(220, () => launchEnergyProjectile(attacker, defender, side, knockDown));
            } else {
                sceneRef.tweens.add({
                    targets: attacker,
                    x: attacker.x + (direction * 85),
                    duration: 220,
                    yoyo: true,
                    onYoyo: knockDown
                });
            }

            finisherTimer = sceneRef.time.delayedCall(2850, () => {
                if (sequence !== finisherSequence) return;
                resetFighters();
                combatLocked = false;
                finisherTimer = null;
                scheduleSparring(650);
            });
        }

        function addAudience(user) {
            if (audiences.length >= 50) {
                const oldAudience = audiences.shift();
                oldAudience.sprite.destroy();
                oldAudience.text.destroy();
            }

            const x = Phaser.Math.Between(65, 475);
            const audienceRow = Phaser.Math.Between(0, 2);
            const y = 205 + (audienceRow * 90) + Phaser.Math.Between(-22, 22);
            const sprite = sceneRef.add.sprite(x, y, 'audience_tex');
            const baseTint = Phaser.Display.Color.RandomRGB().color;
            sprite.setTint(baseTint);

            const nameTag = sceneRef.add.text(x, y - 12, user, {
                fontSize: '9px',
                fill: '#00ff88',
                backgroundColor: '#00000088'
            }).setOrigin(0.5);

            const audience = { user, sprite, text: nameTag, baseTint };
            audiences.push(audience);

            sprite.setScale(0);
            sceneRef.tweens.add({ targets: sprite, scaleX: 1, scaleY: 1, duration: 200 });
            sceneRef.tweens.add({
                targets: [sprite, nameTag],
                y: '-=5',
                duration: Phaser.Math.Between(300, 500),
                yoyo: true,
                repeat: -1,
                delay: Phaser.Math.Between(0, 400)
            });

            return audience;
        }

        function findAudience(user) {
            const normalizedUser = String(user || '').trim().toLowerCase();
            return [...audiences].reverse().find(audience =>
                String(audience.user || '').trim().toLowerCase() === normalizedUser
            );
        }

        function showGiftEffect(data) {
            let audience = findAudience(data.user);
            if (!audience) audience = addAudience(data.user || 'Khán giả');

            const camera = sceneRef.cameras.main;
            const count = Math.max(1, Number(data.count) || 1);
            const giftName = data.giftName || 'Món quà';
            const isLargeGift = data.isLargeGift === true || Number(data.diamondCount) >= 10;
            giftPresentationActive = true;

            if (isLargeGift) {
                combatLocked = true;
                finisherSequence += 1;
                if (finisherTimer) finisherTimer.remove(false);
                finisherTimer = null;
                if (sparringTimer) sparringTimer.remove(false);
            }

            if (giftEffectTimer) giftEffectTimer.remove(false);
            if (giftCleanupTimer) giftCleanupTimer.remove(false);
            if (focusedGiftAudience) {
                if (focusedGiftAudience.sprite.active) {
                    focusedGiftAudience.sprite.setTint(focusedGiftAudience.baseTint);
                }
                if (focusedGiftAudience.text.active) focusedGiftAudience.text.setColor('#00ff88');
            }
            focusedGiftAudience = audience;
            camera.panEffect.reset();
            camera.zoomEffect.reset();

            giftAnnouncement.classList.remove('gift-visible', 'gift-fading');
            giftAnnouncement.textContent = `🎁 ${data.user} tặng ${count}x ${giftName}! 🎁`;
            void giftAnnouncement.offsetWidth;
            giftAnnouncement.classList.add('gift-visible');

            audience.sprite.setTint(0xffd447);
            audience.text.setColor('#fff4a3');

            camera.flash(250, 255, 220, 80);
            camera.pan(audience.sprite.x, audience.sprite.y, 450, 'Sine.easeInOut');
            camera.zoomTo(2.2, 450, 'Sine.easeInOut');

            giftEffectTimer = sceneRef.time.delayedCall(2300, () => {
                giftAnnouncement.classList.add('gift-fading');
                camera.pan(270, 480, 700, 'Sine.easeInOut');
                camera.zoomTo(1, 700, 'Sine.easeInOut');
                if (audience.sprite.active) audience.sprite.setTint(audience.baseTint);
                if (audience.text.active) audience.text.setColor('#00ff88');
                focusedGiftAudience = null;
                giftEffectTimer = null;
            });

            giftCleanupTimer = sceneRef.time.delayedCall(3000, () => {
                giftAnnouncement.classList.remove('gift-visible', 'gift-fading');
                giftCleanupTimer = null;
                giftPresentationActive = false;
                if (isLargeGift) {
                    pendingFinisher = null;
                    sceneRef.time.delayedCall(120, () => runFinisher('red', 'energy', data.user || 'Quà lớn'));
                } else if (pendingFinisher) {
                    const queued = pendingFinisher;
                    pendingFinisher = null;
                    sceneRef.time.delayedCall(120, () => runFinisher(queued.side, queued.action, queued.user));
                }
            });
        }

        // Xử lý Lệnh từ Server gửi xuống
        socket.on('GAME_COMMAND', (data) => {
            log(`${data.type} - ${data.action || ''} (${data.user || ''})`);
            if (!sceneRef) return;

            // 1. TẠO KHÁN GIẢ MỚI
            if (data.type === 'SPAWN_AUDIENCE') {
                addAudience(data.user);
                showJoinMessage(data.user);
            }
            // 2. ACTION/COMMENT KẾT LIỄU
            else if (data.type === 'FINISHER' || data.type === 'ATTACK') {
                runFinisher(data.side || 'blue', data.action || 'punch', data.user);
            }
            // 3. PHÒNG THỦ
            else if (data.type === 'DEFENSE') {
                if (data.action === 'block') {
                    playPose(fighter2, 'block', 1000);
                } else if (data.action === 'dodge') {
                    playPose(fighter2, 'dodge', 850);
                    sceneRef.tweens.add({ targets: fighter2, x: 425, duration: 220, yoyo: true });
                }
            }
            // 4. PHẢN ỨNG TRÚNG ĐÒN
            else if (data.type === 'REACTION') {
                runFinisher(data.side || 'blue', 'punch', data.user);
            }
            // 3. CAMERA
            else if (data.type === 'CAMERA') {
                if (data.action === 'zoom_in') {
                    sceneRef.cameras.main.zoomTo(1.4, 400);
                    setTimeout(() => sceneRef.cameras.main.zoomTo(1.0, 400), 1800);
                }
            }
            // Tương thích sự kiện cũ: hiệu ứng quà lớn chạy sau GIFT_RECEIVED.
            else if (data.type === 'ULTIMATE') {
                log('Đã nhận tín hiệu quà lớn, chờ banner quà hoàn tất...');
            }
            // 5. NGƯỜI XEM TẶNG QUÀ
            else if (data.type === 'GIFT_RECEIVED') {
                showGiftEffect(data);
            }
            // 6. THẢ TIM
            else if (data.type === 'ENVIRONMENT') {
                sceneRef.cameras.main.setBackgroundColor('#2a1a34');
                setTimeout(() => sceneRef.cameras.main.setBackgroundColor('#1a1a24'), 150);
            }
        });

        socket.on('TIKTOK_STATUS', (data) => {
            const statusBox = document.getElementById('status-box');
            if (data.connected) {
                statusBox.innerHTML = `Đã kết nối Live: @${data.username}`;
                statusBox.classList.add('status-online');
                log(`Đã kết nối thành công TikTok Live của: @${data.username}`);
            } else {
                statusBox.innerHTML = `Lỗi kết nối TikTok!`;
                statusBox.classList.remove('status-online');
                log(`Lỗi kết nối TikTok Live.`);
            }
        });

        function openFighterDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(CUSTOM_FIGHTER_DB, 1);
                request.onupgradeneeded = () => {
                    if (!request.result.objectStoreNames.contains('atlases')) {
                        request.result.createObjectStore('atlases');
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveCustomFighterAtlas(side, file) {
            const db = await openFighterDatabase();
            await new Promise((resolve, reject) => {
                const transaction = db.transaction('atlases', 'readwrite');
                transaction.objectStore('atlases').put(file, side);
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
            });
            db.close();
        }

        async function getCustomFighterAtlas(side) {
            const db = await openFighterDatabase();
            const result = await new Promise((resolve, reject) => {
                const request = db.transaction('atlases', 'readonly').objectStore('atlases').get(side);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            db.close();
            return result;
        }

        async function applyFighterAtlas(side, file, persist = true) {
            if (!file || !sceneRef) return;
            const bitmap = await createImageBitmap(file);
            const width = bitmap.width;
            const height = bitmap.height;
            bitmap.close();

            if (width % 4 !== 0 || height % 2 !== 0 || width < 512 || height < 512) {
                throw new Error('Atlas phải chia hết cho 4 cột × 2 hàng và có kích thước tối thiểu 512×512.');
            }

            const frameWidth = width / 4;
            const frameHeight = height / 2;
            const frameRatio = frameWidth / frameHeight;
            if (frameRatio < 0.55 || frameRatio > 1.05) {
                throw new Error('Tỷ lệ mỗi ô không hợp lệ. Mẫu chuẩn là 384×512 cho mỗi pose.');
            }

            const objectUrl = URL.createObjectURL(file);
            const textureKey = `fighter_${side}_custom_${Date.now()}`;
            await new Promise((resolve, reject) => {
                const onLoadError = fileData => {
                    if (fileData && fileData.key === textureKey) {
                        sceneRef.load.off(Phaser.Loader.Events.FILE_LOAD_ERROR, onLoadError);
                        URL.revokeObjectURL(objectUrl);
                        reject(new Error('Không đọc được atlas đã chọn.'));
                    }
                };
                sceneRef.load.on(Phaser.Loader.Events.FILE_LOAD_ERROR, onLoadError);
                sceneRef.load.spritesheet(textureKey, objectUrl, { frameWidth, frameHeight });
                sceneRef.load.once(Phaser.Loader.Events.COMPLETE, () => {
                    sceneRef.load.off(Phaser.Loader.Events.FILE_LOAD_ERROR, onLoadError);
                    const fighter = side === 'red' ? fighter2 : fighter1;
                    fighter.setTexture(textureKey, FIGHTER_FRAME.idle);
                    URL.revokeObjectURL(objectUrl);
                    resolve();
                });
                sceneRef.load.start();
            });

            if (persist) await saveCustomFighterAtlas(side, file);
            log(`${persist ? 'Đã thay và lưu' : 'Đã khôi phục'} thiết kế võ sĩ ${side === 'red' ? 'Đỏ' : 'Xanh'}.`);
        }

        async function replaceFighterAtlas(side, file) {
            try {
                await applyFighterAtlas(side, file, true);
            } catch (error) {
                log(`Lỗi thay võ sĩ: ${error.message}`);
                alert(error.message);
            }
        }

        async function restoreCustomFighterAtlases() {
            try {
                for (const side of ['blue', 'red']) {
                    const savedAtlas = await getCustomFighterAtlas(side);
                    if (savedAtlas) await applyFighterAtlas(side, savedAtlas, false);
                }
            } catch (error) {
                log(`Không khôi phục được thiết kế tùy chỉnh: ${error.message}`);
            }
        }

        function connectTikTok(savedInput = null, automatic = false) {
            if (connectRequestInFlight) return;

            const input = document.getElementById('tiktok-username');
            const username = (savedInput || input.value).trim();
            if (!username) return alert("Vui lòng nhập Username hoặc link TikTok Live!");
            if (automatic) input.value = username;

            log(`Đang gửi yêu cầu kết nối TikTok: ${username}...`);
            connectRequestInFlight = true;
            fetch(`${BACKEND_URL}/api/connect-tiktok`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            }).then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    const message = data.error || 'Không thể kết nối TikTok Live';
                    log(`Lỗi: ${message}`);
                    if (!automatic) alert(message);
                } else {
                    localStorage.setItem(LIVE_INPUT_KEY, username);
                }
            }).catch(err => {
                log(`Lỗi gọi Backend: ${err.message}`);
            }).finally(() => {
                connectRequestInFlight = false;
            });
        }

        function sendTest(type, action, extra = {}) {
            if (!socket.connected) {
                log('Chưa kết nối Server Render nên chưa thể gửi lệnh test.');
                return;
            }

            fetch(`${BACKEND_URL}/api/test-command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type,
                    action,
                    user: 'User_' + Math.floor(Math.random()*100),
                    ...extra
                })
            }).then(async response => {
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || `Backend trả lỗi ${response.status}`);
                }
            }).catch(err => {
                log(`Không gửi được lệnh test: ${err.message}`);
            });
        }
    </script>
